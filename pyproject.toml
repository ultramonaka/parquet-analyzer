[project]
name = "parquet-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "polars>=1.0",
    "pyarrow>=17.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Only needed by tools/convert_to_parquet.sh (MDF/MAT -> Parquet); kept out
# of the main app's dependencies so the GUI install doesn't pull in asammdf/scipy/h5py for
# something most sessions never use. Install with `uv sync --group convert`.
convert = [
    "asammdf>=7.4",
    "scipy>=1.11",
    "h5py>=3.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
