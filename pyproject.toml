[project]
name = "parquet-analyzer"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "polars>=1.0",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyopengl>=3.1.7",
    # Windows has no system tz database; pyarrow/zoneinfo need it for tz-aware timestamp columns
    "tzdata; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "ruff>=0.17",
]
# Only needed by tools/convert_to_parquet.sh (MDF/MAT -> Parquet); kept out
# of the main app's dependencies so the GUI install doesn't pull in asammdf/scipy/h5py for
# something most sessions never use. Install with `uv sync --group convert`.
convert = [
    "asammdf>=7.4",
    "scipy>=1.11",
    "h5py>=3.10",
]

[tool.uv]
package = false

# Lint only (app ch.52): no formatter. E501 is not checked; line-length is used by I (import wrapping).
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures imported from other test modules look like redefinitions (F811) (app 52.1).
"tests/**" = ["F811"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Any test running longer than this dumps every thread's stack, so a hang
# diagnoses itself instead of stopping silently.
faulthandler_timeout = 120
